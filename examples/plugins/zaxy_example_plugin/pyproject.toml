[project]
name = "zaxy-example-plugin"
version = "0.1.0"
description = "Reference external plugin for Zaxy: registers an example.note extractor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zaxy Contributors" }
]
# Depends on the host package at runtime, but only for the public extract/plugin
# surface (zaxy.extract, zaxy.plugins). Declared as a peer dependency so the
# example installs alongside an existing Zaxy install.
dependencies = [
    "zaxy-memory>=2.6.0",
]

# Discovery: installing this distribution makes Zaxy load the plugin
# automatically via importlib.metadata entry points.
[project.entry-points."zaxy.plugins"]
example = "zaxy_example_plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zaxy_example_plugin"]
