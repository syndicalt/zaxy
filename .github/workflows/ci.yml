name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -c constraints/ci.txt

      - name: Lint with ruff
        run: ruff check src tests zaxy_benchmarks

      - name: Type check with mypy
        run: mypy src zaxy_benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -c constraints/ci.txt

      - name: Run unit tests
        run: pytest -m "not integration" --benchmark-disable --cov --cov-report=xml

      - name: Check coverage ratchet
        if: matrix.python-version == '3.13'
        run: python scripts/check-coverage.py --root . --coverage-xml coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -c constraints/ci.txt

      - name: Build and check distribution artifacts
        run: scripts/build-dist.sh --root .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate TLS certificates
        run: ./scripts/generate-certs.sh .certs

      - name: Start Neo4j
        run: docker compose up -d neo4j-test neo4j-tls

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -c constraints/ci.txt

      - name: Wait for Neo4j
        run: |
          for i in {1..30}; do
            curl -s http://localhost:7474 && break
            sleep 1
          done

      - name: Run integration tests
        run: pytest -m integration --tb=short --no-cov

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build docs site (docs sync + astro build + link gate)
        working-directory: web
        run: npm run build
