<svg width="1600" height="640" viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M86 0H0V86" fill="none" stroke="#dce6e2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="64%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#16212b"/>
      <stop offset="72%" stop-color="#0b1014"/>
      <stop offset="100%" stop-color="#070b0e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#2eb7a4"/>
    </marker>
    <g id="zmark">
      <rect x="-19" y="-19" width="38" height="38" rx="9" fill="#f8faf7"/>
      <path d="M-9,-7 H9 L-9,7 H10" fill="none" stroke="#0b1014" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="640" fill="url(#vig)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <!-- LEFT: title block -->
  <text x="96" y="150" font-family="JetBrains Mono, monospace" font-size="22" letter-spacing="5" fill="#2eb7a4">RELEASE · v2.5.0</text>
  <text x="92" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#f8faf7">Portable memory,</text>
  <text x="92" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#f8faf7">end to end.</text>
  <text x="96" y="392" font-family="Inter, system-ui, sans-serif" font-size="25" fill="#9fb0aa">A product-agnostic export contract: cited bundles you can</text>
  <text x="96" y="426" font-family="Inter, system-ui, sans-serif" font-size="25" fill="#9fb0aa">pull, verifiably disclose in part, and push — one shared path.</text>

  <!-- signed-path honesty pill -->
  <g transform="translate(96,470)">
    <rect x="0" y="0" width="462" height="44" rx="22" fill="none" stroke="#c58b2c" stroke-width="2"/>
    <circle cx="26" cy="22" r="6" fill="#c58b2c"/>
    <text x="44" y="29" font-family="JetBrains Mono, monospace" font-size="15" fill="#e0c08a">SIGNED PATH EXPERIMENTAL · unsigned GA-ready</text>
  </g>

  <!-- RIGHT: one contract, three surfaces -->
  <g transform="translate(1100,212)" font-family="JetBrains Mono, monospace">
    <!-- source -> bundle -->
    <g stroke="#2eb7a4" stroke-width="2.5" stroke-opacity="0.8" fill="none">
      <line x1="118" y1="44" x2="196" y2="44" marker-end="url(#arrow)"/>
      <!-- bundle -> three surfaces -->
      <line x1="320" y1="44" x2="392" y2="-2" marker-end="url(#arrow)"/>
      <line x1="320" y1="44" x2="392" y2="44" marker-end="url(#arrow)"/>
      <line x1="320" y1="44" x2="392" y2="90" marker-end="url(#arrow)"/>
    </g>

    <!-- session source -->
    <rect x="8" y="20" width="110" height="48" rx="9" fill="#0e1620" stroke="#3a4750" stroke-width="2"/>
    <text x="63" y="49" text-anchor="middle" font-size="16" fill="#9fb0aa">session</text>

    <!-- signed bundle with Merkle seal -->
    <rect x="200" y="6" width="120" height="76" rx="11" fill="#0e1620" stroke="#2eb7a4" stroke-width="2.5" filter="url(#glow)"/>
    <g transform="translate(260,30)" stroke="#2eb7a4" stroke-width="2" fill="none">
      <line x1="0" y1="-8" x2="-16" y2="8"/><line x1="0" y1="-8" x2="16" y2="8"/>
      <circle cx="0" cy="-8" r="4.5" fill="#0e1620"/><circle cx="-16" cy="10" r="3.5" fill="#0e1620"/><circle cx="16" cy="10" r="3.5" fill="#0e1620"/>
    </g>
    <text x="260" y="68" text-anchor="middle" font-size="15" fill="#cdd9d3">bundle</text>

    <!-- three surfaces -->
    <g font-size="15">
      <rect x="396" y="-24" width="118" height="40" rx="20" fill="#0e1620" stroke="#3a4750" stroke-width="2"/>
      <text x="455" y="1" text-anchor="middle" fill="#9fb0aa">pull</text>
      <rect x="396" y="24" width="118" height="40" rx="20" fill="#0e1620" stroke="#3a4750" stroke-width="2"/>
      <text x="455" y="49" text-anchor="middle" fill="#9fb0aa">disclose</text>
      <rect x="396" y="72" width="118" height="40" rx="20" fill="#0e1620" stroke="#3a4750" stroke-width="2"/>
      <text x="455" y="97" text-anchor="middle" fill="#9fb0aa">push</text>
    </g>
  </g>
  <text x="1320" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#66747a">cited entries · selector · Merkle proofs</text>

  <!-- footer brand -->
  <g transform="translate(98,560)">
    <use href="#zmark" transform="scale(0.85)"/>
    <text x="32" y="7" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#f8faf7">Zaxy</text>
    <text x="104" y="7" font-family="JetBrains Mono, monospace" font-size="15" fill="#66747a">auditable agent memory · MIT</text>
  </g>
</svg>
