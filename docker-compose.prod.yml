services:
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_bolt_tls__level: REQUIRED
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /ssl/bolt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
    secrets:
      - neo4j_auth
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ${NEO4J_TLS_CERTS_DIR:-./.certs/neo4j}:/ssl/bolt:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  zaxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ZAXY_ENV: production
      PROJECTION_BACKEND: "${PROJECTION_BACKEND:-embedded}"
      EMBEDDED_GRAPH_PATH: "${EMBEDDED_GRAPH_PATH:-/app/.eventloom/projections/embedded.kuzu}"
      LATTICEDB_PATH: "${LATTICEDB_PATH:-/app/.eventloom/projections/memory.latticedb}"
      NEO4J_AUTO_START: "${NEO4J_AUTO_START:-false}"
      PGGRAPH_DSN: "${PGGRAPH_DSN:-postgresql://postgres:postgres@pggraph:5432/zaxy}"
      PGGRAPH_AUTO_START: "${PGGRAPH_AUTO_START:-false}"
      EVENTLOOM_PATH: /app/.eventloom
      EVENTLOOM_THREAD: "${EVENTLOOM_THREAD:-default}"
      PATHLIGHT_URL: "${PATHLIGHT_URL:-http://pathlight-collector:4100}"
      PATHLIGHT_ENABLED: "${PATHLIGHT_ENABLED:-false}"
      PATHLIGHT_ACCESS_TOKEN_FILE: /run/secrets/pathlight_access_token
      TRACE_RAW_QUERIES: "${TRACE_RAW_QUERIES:-false}"
      MCP_ADMIN_TOKEN_FILE: /run/secrets/mcp_admin_token
      MCP_REMOTE_AUTH_TOKEN_FILE: /run/secrets/mcp_remote_auth_token
      MCP_REMOTE_SESSION_HEADER: "${MCP_REMOTE_SESSION_HEADER:-x-zaxy-session-id}"
      SERVER_NAME: "${SERVER_NAME:-zaxy-memory}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: json
      QUERY_DEFAULT_LIMIT: "${QUERY_DEFAULT_LIMIT:-10}"
      EMBEDDING_ENABLED: "${EMBEDDING_ENABLED:-true}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-hash}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1536}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - mcp_admin_token
      - mcp_remote_auth_token
      - openai_api_key
      - pathlight_access_token
    volumes:
      - eventloom_data:/app/.eventloom
    healthcheck:
      test: ["CMD", "zaxy", "status"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  zaxy-neo4j:
    profiles: ["neo4j"]
    extends:
      service: zaxy
    environment:
      ZAXY_ENV: production
      PROJECTION_BACKEND: neo4j
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_CA_CERT: "${NEO4J_CA_CERT:-/ssl/bolt/trusted/public.crt}"
      NEO4J_TRUST_ALL: "${NEO4J_TRUST_ALL:-false}"
      NEO4J_AUTO_START: "false"
    secrets:
      - neo4j_password
      - mcp_admin_token
      - mcp_remote_auth_token
      - openai_api_key
      - pathlight_access_token
    volumes:
      - eventloom_data:/app/.eventloom
      - ${NEO4J_TLS_CERTS_DIR:-./.certs/neo4j}:/ssl/bolt:ro
    depends_on:
      neo4j:
        condition: service_healthy

secrets:
  neo4j_auth:
    file: ./secrets/neo4j_auth.txt
  neo4j_password:
    file: ./secrets/neo4j_password.txt
  mcp_admin_token:
    file: ./secrets/mcp_admin_token.txt
  mcp_remote_auth_token:
    file: ./secrets/mcp_remote_auth_token.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  pathlight_access_token:
    file: ./secrets/pathlight_access_token.txt

volumes:
  neo4j_data:
  neo4j_logs:
  eventloom_data:
