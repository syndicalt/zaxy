services:
  # ------------------------------------------------------------------
  # Core memory: Neo4j
  # ------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpassword}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Test Neo4j (ephemeral, for CI/integration tests)
  # ------------------------------------------------------------------
  neo4j-test:
    image: neo4j:5.26-community
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpassword}"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Zaxy MCP Server
  # ------------------------------------------------------------------
  zaxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-testpassword}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      EVENTLOOM_PATH: /app/.eventloom
      EVENTLOOM_THREAD: "${EVENTLOOM_THREAD:-default}"
      PATHLIGHT_URL: "${PATHLIGHT_URL:-http://pathlight-collector:4100}"
      SERVER_NAME: "${SERVER_NAME:-zaxy-memory}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      QUERY_DEFAULT_LIMIT: "${QUERY_DEFAULT_LIMIT:-10}"
    volumes:
      - eventloom_data:/app/.eventloom
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "zaxy", "status"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  eventloom_data:
